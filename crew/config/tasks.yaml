gather:
  description: >
    Use the News Fetcher Tool once, passing every beat as a single
    comma-separated string: {topics}
    Discard anything that is not a news story, is older than roughly a day, or
    is missing a working source link. Keep the JSON structure exactly as the
    tool returned it.
  expected_output: >
    A short plain-text note saying how many articles were fetched and which
    beats they covered. The articles themselves are held by the tool.
  agent: scout

edit:
  description: >
    Call the Intelligent Summarizer Tool exactly once, with max_stories set to
    the string "{max_articles}". It reads the articles the scout collected,
    writes each summary, drops duplicates and ranks high impact first. Read the
    receipt it returns and judge whether the briefing looks sound.
    Every tool argument must be given as a plain string.
  expected_output: >
    A short plain-text note saying how many stories made the briefing and how
    many were dropped. The briefing itself is held by the tool.
  agent: editor
  context:
    - gather

distribute:
  description: >
    Publish the edited briefing. First call the Slack Bot Tool with intro set
    to a short one-line note about today's briefing, or to "" if none fits.
    Then call the Sheets Logger Tool with run_id set to the string "{run_id}".
    Both read the briefing the editor produced, so neither needs the stories
    passed to it. Every tool argument must be given as a plain string, and each
    tool is called exactly once. Report precisely what each tool returned,
    including failures, and do not retry a channel that reports itself as
    unconfigured.
  expected_output: >
    A short plain-text report naming the number of stories published, whether
    Slack delivery succeeded, and how many rows reached Google Sheets. Mention
    any channel that was skipped and why.
  agent: distributor
  context:
    - edit
